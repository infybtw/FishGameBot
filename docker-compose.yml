services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fishbot
      POSTGRES_USER: fishbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishbot -d fishbot"]
      interval: 5s
      timeout: 3s
      retries: 10
  bot:
    image: ghcr.io/infybtw/fishgamebot:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fishbot:${POSTGRES_PASSWORD:-testpass}@postgres:5432/fishbot
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      ADMIN_USER_ID: ${ADMIN_USER_ID:?set ADMIN_USER_ID in .env}
      CATCH_SUCCESS_CHANCE: ${CATCH_SUCCESS_CHANCE:-50}
      CATCH_DELAY: ${CATCH_DELAY:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  adminer:
    image: adminer:6.0.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      # Loopback only: reach via SSH tunnel (ssh -L 8080:127.0.0.1:8080) or a reverse proxy.
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
