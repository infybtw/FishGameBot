# Dev stack: only Postgres in Docker; run the bot on the host with `bun run dev`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fishbot
      POSTGRES_USER: fishbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishbot -d fishbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
